<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="title desc" style="background: #ffffff;">
  <title id="title">Lippmann integral photography plate</title>
  <desc id="desc">A cross-sectional schematic of Lippmann's integral photography plate. The upper spherical surface acts as a microlens array, while the lower curved surface is coated with a photosensitive layer.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --ink: #000000;
      --muted: rgba(0, 0, 0, 0.62);
      --glass: rgba(42, 120, 214, 0.10);
      --glass-stroke: #2a78d6;
      --photo: #c73333;
      --ray: rgba(42, 120, 214, 0.58);
      --focus: rgba(199, 51, 51, 0.62);
    }
    svg {
      background: var(--bg);
    }
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: var(--ink);
    }
    .label { font-size: 18px; font-weight: 650; }
    .note { font-size: 14px; fill: var(--muted); }
    .plate-fill { fill: var(--glass); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .top-surface { fill: none; stroke: var(--glass-stroke); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .photo-layer { fill: none; stroke: var(--photo); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .ray { fill: none; stroke: var(--ray); stroke-width: 2; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .focus-ray { fill: none; stroke: var(--focus); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 5 6; vector-effect: non-scaling-stroke; }
    .callout { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink)" />
    </marker>
    <marker id="ray-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ray)" />
    </marker>
  </defs>

  <!-- incoming nearly parallel rays -->
  <path d="M 188 44 V 92" class="ray" marker-end="url(#ray-arrow)" />
  <path d="M 288 44 V 92" class="ray" marker-end="url(#ray-arrow)" />
  <path d="M 388 44 V 92" class="ray" marker-end="url(#ray-arrow)" />
  <path d="M 488 44 V 92" class="ray" marker-end="url(#ray-arrow)" />
  <path d="M 588 44 V 92" class="ray" marker-end="url(#ray-arrow)" />
  <path d="M 688 44 V 92" class="ray" marker-end="url(#ray-arrow)" />
  <path d="M 788 44 V 92" class="ray" marker-end="url(#ray-arrow)" />

  <!-- plate body -->
  <path class="plate-fill" d="
    M 138 142
    Q 188 70 238 142
    Q 288 70 338 142
    Q 388 70 438 142
    Q 488 70 538 142
    Q 588 70 638 142
    Q 688 70 738 142
    Q 788 70 838 142
    L 838 214
    Q 788 254 738 214
    Q 688 254 638 214
    Q 588 254 538 214
    Q 488 254 438 214
    Q 388 254 338 214
    Q 288 254 238 214
    Q 188 254 138 214
    Z" />

  <!-- emphasize upper microlens surface and lower photosensitive surface -->
  <path class="top-surface" d="
    M 138 142
    Q 188 70 238 142
    Q 288 70 338 142
    Q 388 70 438 142
    Q 488 70 538 142
    Q 588 70 638 142
    Q 688 70 738 142
    Q 788 70 838 142" />

  <path class="photo-layer" d="
    M 138 214
    Q 188 254 238 214
    Q 288 254 338 214
    Q 388 254 438 214
    Q 488 254 538 214
    Q 588 254 638 214
    Q 688 254 738 214
    Q 788 254 838 214" />

  <!-- focusing rays inside several cells -->
  <path d="M 170 143 L 188 235 L 218 143" class="focus-ray" />
  <path d="M 370 143 L 388 235 L 418 143" class="focus-ray" />
  <path d="M 570 143 L 588 235 L 618 143" class="focus-ray" />
  <path d="M 770 143 L 788 235 L 818 143" class="focus-ray" />

  <!-- labels -->
  <text x="116" y="315" class="label">Lippmann integral photography plate</text>
  <text x="116" y="338" class="note">upper spherical surface: focusing microlenses · lower spherical surface: photosensitive layer</text>

  <path d="M 708 92 C 738 60 785 54 816 82" class="callout" marker-end="url(#arrow)" />
  <text x="646" y="48" class="label">spherical lens surface</text>

  <path d="M 740 286 C 706 274 664 254 620 225" class="callout" marker-end="url(#arrow)" />
  <text x="724" y="302" class="label">photosensitive coating</text>
</svg>
