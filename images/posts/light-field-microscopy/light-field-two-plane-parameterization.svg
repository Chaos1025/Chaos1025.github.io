<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" style="background: #ffffff;">
  <title id="title">Two-plane parameterization of a 4D light field</title>
  <desc id="desc">A light ray is represented by its intersections with two parallel planes: the spatial plane x-y and the angular plane u-v.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text-primary: #000000;
      --text-secondary: #000000;
      --muted: #000000;
      --grid: rgba(0, 0, 0, 0.36);
      --axis: #000000;
      --axis-label: #000000;
      --blue: #2a78d6;
      --aqua: #1b8f68;
      --plane-xy: rgba(42, 120, 214, 0.10);
      --plane-uv: rgba(27, 143, 104, 0.10);
      --point-ring: #000000;
    }
    svg {
      background: var(--bg);
    }
    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: var(--text-secondary);
    }
    .title { font-size: 24px; font-weight: 650; fill: var(--text-primary); }
    .subtitle { font-size: 15px; fill: var(--muted); }
    .label { font-size: 24px; font-weight: 700; fill: var(--text-primary); }
    .small { font-size: 14px; fill: var(--muted); }
    .math { font-size: 18px; font-style: italic; fill: var(--axis-label); }
    .plane-outline { stroke-width: 2; vector-effect: non-scaling-stroke; }
    .grid-line { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .axis { stroke: var(--axis); stroke-width: 1.7; vector-effect: non-scaling-stroke; }
    .ray { fill: none; stroke-linecap: round; stroke-width: 3; vector-effect: non-scaling-stroke; }
    .ray-soft { fill: none; stroke-linecap: round; stroke-width: 2; opacity: 0.45; vector-effect: non-scaling-stroke; }
    .point { stroke: var(--point-ring); stroke-width: 3; vector-effect: non-scaling-stroke; }
  </style>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--aqua)" />
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--axis)" />
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="var(--shadow)" />
    </filter>
  </defs>

  <!-- <text x="64" y="62" class="title">Two-plane parameterization of a 4D light field</text> -->
  <!-- <text x="64" y="90" class="subtitle">A ray is indexed by where it intersects two parallel planes.</text> -->

  <!-- Back angular plane: Πuv -->
  <g>
    <polygon points="568,128 828,178 828,420 568,370" fill="var(--plane-uv)" stroke="var(--aqua)" class="plane-outline" />
    <line x1="620" y1="138" x2="620" y2="380" class="grid-line" />
    <line x1="672" y1="148" x2="672" y2="390" class="grid-line" />
    <line x1="724" y1="158" x2="724" y2="400" class="grid-line" />
    <line x1="776" y1="168" x2="776" y2="410" class="grid-line" />
    <line x1="568" y1="188" x2="828" y2="238" class="grid-line" />
    <line x1="568" y1="248" x2="828" y2="298" class="grid-line" />
    <line x1="568" y1="308" x2="828" y2="358" class="grid-line" />
  </g>

  <!-- Front spatial plane: Πxy -->
  <g>
    <polygon points="152,128 412,178 412,420 152,370" fill="var(--plane-xy)" stroke="var(--blue)" class="plane-outline" />
    <line x1="204" y1="138" x2="204" y2="380" class="grid-line" />
    <line x1="256" y1="148" x2="256" y2="390" class="grid-line" />
    <line x1="308" y1="158" x2="308" y2="400" class="grid-line" />
    <line x1="360" y1="168" x2="360" y2="410" class="grid-line" />
    <line x1="152" y1="188" x2="412" y2="238" class="grid-line" />
    <line x1="152" y1="248" x2="412" y2="298" class="grid-line" />
    <line x1="152" y1="308" x2="412" y2="358" class="grid-line" />
  </g>

  <!-- Rays through both planes -->
  <path d="M 82 274 C 230 268, 365 263, 740 250" class="ray" stroke="var(--blue)" marker-end="url(#arrow-blue)" />
  <path d="M 125 170 C 270 207, 404 240, 770 334" class="ray" stroke="var(--aqua)" marker-end="url(#arrow-aqua)" />

  <!-- Intersection points -->
  <circle cx="292" cy="266" r="8" fill="var(--blue)" class="point" />
  <circle cx="688" cy="252" r="8" fill="var(--blue)" class="point" />
  <circle cx="320" cy="218" r="7" fill="var(--aqua)" class="point" />
  <circle cx="715" cy="320" r="7" fill="var(--aqua)" class="point" />

  <!-- Coordinate axes on front plane -->
  <line x1="138" y1="382" x2="238" y2="401" class="axis" marker-end="url(#arrow-axis)" />
  <line x1="138" y1="382" x2="138" y2="286" class="axis" marker-end="url(#arrow-axis)" />
  <text x="246" y="410" class="math">x</text>
  <text x="118" y="296" class="math">y</text>

  <!-- Coordinate axes on back plane -->
  <line x1="554" y1="382" x2="654" y2="401" class="axis" marker-end="url(#arrow-axis)" />
  <line x1="554" y1="382" x2="554" y2="286" class="axis" marker-end="url(#arrow-axis)" />
  <text x="664" y="410" class="math">u</text>
  <text x="534" y="296" class="math">v</text>

  <!-- Labels -->
  <!-- <text x="150" y="112" class="label">Spatial plane Π<tspan baseline-shift="sub" font-size="12">xy</tspan></text> -->
  <text x="282" y="130" text-anchor="middle" class="label">Π<tspan baseline-shift="sub" font-size="15">xy</tspan></text>
  <!-- <text x="150" y="450" class="small">intersection: (x, y)</text> -->
  <!-- <text x="150" y="450" class="small"> 交点: (x, y)</text> -->
  <!-- <text x="566" y="112" class="label">Angular plane Π<tspan baseline-shift="sub" font-size="12">uv</tspan></text> -->
  <!-- <text x="566" y="450" class="small">intersection: (u, v)</text> -->
  <text x="698" y="130" text-anchor="middle" class="label">Π<tspan baseline-shift="sub" font-size="15">uv</tspan></text>
  <!-- <text x="566" y="450" class="small"> 交点: (u, v)</text> -->

  <!-- <text x="439" y="238" class="small">same ray, two samples</text> -->
</svg>
